<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sun & Moon Toggle</title>
<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="Sun & Moon Toggle">
<meta property="og:description" content="Interactive Sun & Moon animation">
<meta property="og:image" content="https://myya-design.github.io/toggles/og.png">
<meta property="og:url" content="https://myya-design.github.io/toggles/">
<style>
:root{color-scheme:light;--pink:#f3e3f1}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--pink);display:grid;place-items:center;font-family:Arial,sans-serif}.toggles{width:min(80vw,800px);display:grid;gap:clamp(45px,9vw,125px)}.toggle{appearance:none;border:0;padding:0;display:block;position:relative;width:100%;aspect-ratio:2.5/1;border-radius:999px;overflow:hidden;cursor:pointer;isolation:isolate;box-shadow:inset 0 0 0 8px rgba(255,255,255,.5);transition:filter .25s}.toggle:focus-visible{outline:4px solid #a184df;outline-offset:8px}.toggle .sky{position:absolute;inset:0;border-radius:inherit;transition:background .6s}.day .sky{background:linear-gradient(180deg,#4665c8 0%,#8790c6 48%,#ffeb96 100%)}.night .sky{background:linear-gradient(180deg,#1b2334 0%,#50618d 100%)}.toggle::after{content:"";position:absolute;inset:0;border:8px solid rgba(255,255,255,.42);border-radius:inherit;pointer-events:none;z-index:9}.rings{position:absolute;top:50%;left:20%;width:62%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:rgba(255,233,116,.22);box-shadow:0 0 0 38px rgba(255,229,109,.2),0 0 0 78px rgba(255,229,109,.15);transition:left .8s,background .8s,box-shadow .8s}.night .rings{left:80%;background:rgba(215,220,248,.18);box-shadow:0 0 0 38px rgba(215,220,248,.14),0 0 0 78px rgba(215,220,248,.11)}.orb{position:absolute;z-index:4;top:9%;left:3.5%;height:82%;aspect-ratio:1;border-radius:50%;background:#ffe500;border:5px solid rgba(255,255,255,.62);box-shadow:0 6px 0 rgba(122,101,15,.25);transition:left .8s cubic-bezier(.2,.8,.2,1),background .6s,border-color .6s}.night .orb{left:63.5%;background:#d9dced;border-color:#f6f4ff;box-shadow:0 6px 0 rgba(80,82,116,.35)}.crater{position:absolute;background:#abb3dc;border-radius:50%;opacity:0;transition:opacity .4s}.night .crater{opacity:1}.crater.one{width:28%;height:28%;left:50%;top:18%}.crater.two{width:15%;height:15%;left:15%;top:39%}.crater.three{width:22%;height:22%;left:44%;top:65%}.clouds{position:absolute;inset:0;transition:opacity .4s,transform .8s}.cloud{position:absolute;width:32%;height:31%;background:linear-gradient(#fafaff,#d0d0ce);border-radius:999px;right:8%;bottom:21%;filter:drop-shadow(0 2px 1px rgba(255,255,255,.12))}.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:inherit}.cloud:before{width:55%;height:145%;left:19%;bottom:23%}.cloud:after{width:47%;height:110%;right:5%;bottom:7%}.cloud.back{right:29%;bottom:37%;width:24%;height:25%;opacity:.65}.cloud.back:before{width:60%;height:180%}.night .clouds{opacity:0;transform:translateX(30%)}.stars{position:absolute;inset:0;opacity:0;transition:opacity .5s}.night .stars{opacity:1}.star{position:absolute;color:#f5f6ff;font-size:clamp(12px,2.8vw,31px);text-shadow:0 0 7px white;animation:twinkle 2.5s infinite alternate}.star:nth-child(1){left:9%;top:22%}.star:nth-child(2){left:20%;top:38%;font-size:22px;animation-delay:.3s}.star:nth-child(3){left:34%;top:24%;animation-delay:.7s}.star:nth-child(4){left:44%;top:11%;font-size:20px}.star:nth-child(5){left:12%;top:66%}.star:nth-child(6){left:26%;top:78%;font-size:19px}.star:nth-child(7){left:43%;top:76%}.star:nth-child(8){left:24%;top:12%;font-size:13px}.star:nth-child(9){left:40%;top:54%;font-size:14px}@keyframes twinkle{from{opacity:.5;transform:scale(.8)}to{opacity:1;transform:scale(1.15)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="toggles" aria-label="Day and night toggle demo">
<button class="toggle day" id="dayToggle" role="switch" aria-checked="false" aria-label="Switch day scene to night">
<span class="sky"></span><span class="rings"></span><span class="clouds"><span class="cloud back"></span><span class="cloud"></span></span><span class="stars" aria-hidden="true"></span><span class="orb"><span class="crater one"></span><span class="crater two"></span><span class="crater three"></span></span>
</button>
</main>
<script>
for(const toggle of document.querySelectorAll('.toggle')){
  toggle.querySelector('.stars').innerHTML=Array.from({length:9},()=>'<span class="star">✦</span>').join('');
  toggle.addEventListener('click',()=>{
    const isNight=toggle.classList.toggle('night');
    toggle.classList.toggle('day',!isNight);
    toggle.setAttribute('aria-checked',String(isNight));
    toggle.setAttribute('aria-label',isNight?'Switch night scene to day':'Switch day scene to night');
  });
}
</script>
</body>
</html>
